{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Мій Блог</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <header>
        <h1>Список статей</h1>
    </header>

    <main>
        {% for post in posts %}
            <article>
                <h2>{{ post.title }}</h2>
                <p>Автор: {{ post.author }}</p>
                <p>{{ post.content|truncatewords:20 }}</p>
                <a href="{% url 'blog:post_detail' post.id %}">Читати далі</a>
            </article>
        {% endfor %}
    </main>

    <footer>
        <p>&copy; 2026 Мій Django Проєкт</p>
    </footer>
</body>
</html>
