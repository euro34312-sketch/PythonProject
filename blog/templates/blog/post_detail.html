{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{{ post.title }}</title>
    <link rel="stylesheet" href="{% static 'blog/css/style.css' %}">
</head>
<body>
    <header>
        <nav>
            <a href="{% url 'blog:index' %}">← Назад до списку</a>
        </nav>
    </header>

    <main>
        <article>
            <h1>{{ post.title }}</h1>
            <p><em>Опубліковано: {{ post.published_date }} | Автор: {{ post.author }}</em></p>
            <hr>
            <div class="content">
                {{ post.content|linebreaks }}
            </div>
        </article>
    </main>

    <footer>
        <p>&copy; 2026 Мій Django Проєкт</p>
    </footer>
</body>
</html>
