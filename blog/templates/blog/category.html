<!DOCTYPE html>
<!DOCTYPE html>
<html>
<head>
    <title>{{ category }}</title>
    <link rel="stylesheet" href="/static/blog/css/style.css">
</head>
<body class="container">
    <a href="/">← Головна</a>
    <h1>Категорія: {{ category }}</h1>
    {% for post in posts %}
        <div class="item">
            <h3><a href="/post/{{ post.id }}/">{{ post.title }}</a></h3>
            <p>Автор: {{ post.author }}</p>
        </div>
    {% endfor %}
</body>
</html>
